<!-- Instructions
Create a full HTML file with a <!DOCTYPE html> declaration and a <html> element with:

A <head> element with a <title> page title
A <body> element with a <h1> heading, and an <ol> ordered list that describes the lifecycle of a butterfly, from egg to adult butterfly. -->

<!DOCTYPE html>
<html>
<head>
  <title>Metamorphosis</title>
</head>
<body>
  <h1>Butterfly's life cycle</h1>
  <ol>
  <li>egg</li>
  <li>caterpillar</li>
  <li>chrysalis</li>
  <li>butterfly</li>
  </ol>
</body>
</html>
