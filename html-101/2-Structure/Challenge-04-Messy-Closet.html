<!-- Instructions
Create an HTML file that has the following:

An <h1> heading that says "My Closet"
Two <a> links at the top of the page:
One that links to #winter
One that links to #summer
Two <div> elements, each with a class of "closet-section". Inside each <div>:
Add an <h2> with a class of "category"
Give each <h2> a unique id (winter and summer)
Add a <p> describing the clothes in that category -->

<!DOCTYPE html>
<html>
<head>
  <title>Messy Closet</title>
</head>
<body>
  <h1>My Closet</h1>
  <p>
    <a href="#winter">winter</a>
    <a href="#summer">summer</a>
  </p>
  <div class="closet-section">
  <h2 class="category" id="winter"></h2>
  <p>coat
jacket
sweater
hoodie
scarf
gloves
boots
pants
beanie
cardigan</p>
  </div>
  <div class="closet-section">
  <h2 class="category" id="summer"></h2>
  <p>t-shirt
shorts
dress
skirt
tank top
sandals
flip-flops
swimsuit
sunglasses
cap</p>
  </div>
</body>
</html>
