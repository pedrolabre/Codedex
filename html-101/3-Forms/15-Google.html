<!-- Instructions
Let's recreate one of the most recognizable forms on the web: the original Google search bar!
Add the following elements:

A <form> element. For now, we can either set the action and method attributes to nothing, "", or just not add them.
A <p> element with "Search the web using Google!"
An <input> with the type set to "text".
One or two <br> line breaks.
Another <input>, but this time the type is set to "submit" (its text should say "Google Search"). -->

<!DOCTYPE html>
<html>
  <head>
    <title>Google</title>
  </head>
  <body>
    <form action="" method="">
      <p>Search the web using Google!</p>
      <input type="text">
      <br><br>
      <input type="submit" value="Google Search">
    </form>
  </body>
</html>
