<!-- Instructions
Create a sign_up.html file with a classic sign up page.
add <input> elements with:

A username
An email
A password
A submit button -->

<!DOCTYPE html>
<html>
  <head>
    <title>Sign Up</title>
  </head>
  <body>
    <form>
      <h2>Sign Up</h2>

      Username:<br>
      <input type="text">
      <br><br>

      Email:<br>
      <input type="email">
      <br><br>

      Password:<br>
      <input type="password">
      <br><br>

      <input type="submit">
    </form>
  </body>
</html>
