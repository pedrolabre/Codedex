<!-- Instructions
Add the appropriate type attributes:

A text input for their name.
Three radio buttons labeled as "Yes", "No", and "Maybe" (with a matching name of "invite").
Either three or five checkbox options to specify dietary restrictions like "Vegetarian" and "Gluten-free".
An input to submit the form.-->

<!DOCTYPE html>
<html>
  <head>
    <title>RSVP</title>
  </head>
  <body>
    <form>
      <h2>RSVP</h2>
      <p>Come and make our special day more awesome!</p>
      <br>
      Name: 
      <input type="text">
      <br><br>
      Are you coming?<br>      
      <input type="radio" name="invite">: Yes
      <input type="radio" name="invite">: No
      <input type="radio" name="invite">: Maybe
      <br><br>
      Any dietary restrictions for main course?<br>
      <input type="checkbox"> Vegetarian
      <input type="checkbox"> Gluten-free
      <input type="checkbox"> Suggar
      <input type="checkbox"> Fat
      <input type="checkbox"> Dairy
      <br><br>
      <input type="submit">
    </form>
  </body>
</html>
