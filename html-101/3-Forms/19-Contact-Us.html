<!-- Instructions
Add these:

A <label> and <input> for a name.
A <label> and <textarea> for a message.
An <input> element to submit the contact form.
Make sure to link the label and their element!

Bonus: Add a "I'm not a robot" checkbox before submit.-->

<!DOCTYPE html>
<html>
  <head>
    <title>Contact Us</title>
  </head>
  <body>
    <form>
      <h2>Contact Us</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
      <br><br>

      <label for="message">Message:</label>
      <textarea id="message" name="message"></textarea>
      <br><br>

      <input type="checkbox" id="not-robot" name="not-robot">
      <label for="not-robot">I'm not a robot</label>
      <br><br>

      <input type="submit">
    </form>
  </body>
</html>
