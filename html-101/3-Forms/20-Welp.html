<!-- Instructions
Add a <form> element with:

*Name of the item being reviewed.
Three "radio" buttons for "Would you try it again?"
*A review rating from 1 to 5.
A <textarea> for a comment (max 250 characters).
A "submit" button that says "Submit Review".
Fields marked with an asterisk (*) are required.

Make sure to add labels and validate the inputs!-->

<!DOCTYPE html>
<html>
  <head>
    <title>Welp</title>
  </head>
  <body>
    <form>
      <h2>Welp</h2>

      <label for="item-name">Item Name:</label>
      <input type="text" id="item-name" name="item-name" required>
      <br><br>

      <p>Would you try it again?</p>

      <input type="radio" id="try-yes" name="try-again" value="yes">
      <label for="try-yes">Yes</label>

      <input type="radio" id="try-maybe" name="try-again" value="maybe">
      <label for="try-maybe">Maybe</label>

      <input type="radio" id="try-no" name="try-again" value="no">
      <label for="try-no">No</label>
      <br><br>

      <label for="rating">Rating:</label>
      <input type="number" id="rating" name="rating" min="1" max="5" required>
      <br><br>

      <label for="comment">Comment:</label>
      <textarea id="comment" name="comment" maxlength="250"></textarea>
      <br><br>

      <input type="submit" value="Submit Review">
    </form>
  </body>
</html>
