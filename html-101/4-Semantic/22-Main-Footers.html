<!-- Instructions
Add a <main> element beneath the <header> element defined in the last exercise.

Then, insert a <h2> heading element inside the <main> element, to display your blog title.

Next, add a <footer> element below the <main> element. Then, add the following:

An <ul> unordered list element.
Two or three <li> list elements of common footer links ("Archive", "Legal", etc.) -->

<!DOCTYPE html>
<html>
  <head>
    <title>Pedro Labre's Blog</title>
  </head>
  <body>
    <header>
      <h1>Pedro Labre's Blog</h1>
      <ul>
        <li>About</li>
        <li>Stories</li>
      </ul>
    </header>
    <main>
      <h2>Pedro Labre's Blog</h2>
      </main>
    <footer>
      <ul>
        <li>Archive</li>
        <li>Legal</li>
      </ul>
      </footer>
  </body>
</html>
